<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#4f0991" />
  <title>Mambo</title>
  
  <style>
    :root {
      --mambo-violet: #4f0991;
      --mambo-white: #FFFFFF;
    }

    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #FFFFFF;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: var(--mambo-white); 
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease-out;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container img {
      height: 130px; 
      width: auto;
      object-fit: contain;
      display: block;
    }

    #mambo-moving-logo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      /* Utilisation exclusive de transform pour une fluidité matérielle maximale */
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.2, 1), opacity 0.3s ease;
    }

    /* TRANSITION FLUIDE SANS REFLOW : Changement d'échelle et déplacement combinés */
    #splash-screen.shrink #mambo-moving-logo {
      /* Désactive le centrage flex global pour s'aligner sur le coin supérieur gauche */
      align-items: flex-start;
      justify-content: flex-start;
      /* Placement exact basé sur top: 13px et padding-left: 5vw de .mambo-header-badge */
      transform: translate3d(5vw, 13px, 0) scale(0.34615); /* 45px de destination / 130px initiaux = 0.34615 */
      transform-origin: left top;
    }

    .layer-top {
      background-color: var(--mambo-violet);
      z-index: 20;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
      transition: clip-path 0.85s cubic-bezier(0.7, 0, 0.15, 1);
    }

    #logo-1 {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #splash-screen.swipe-active .layer-top {
      clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%);
    }

    #root {
      opacity: 0;
      transition: opacity 0.25s ease-in;
    }

    #splash-screen.shrink ~ #root {
      opacity: 1;
    }

    .fade-out {
      opacity: 0 !important;
      pointer-events: none;
    }

    .instantly-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      transition: none !important;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div id="mambo-moving-logo" class="logo-container">
      <img src="/MAMBO PREMIUM.png" alt="Premium">
    </div>

    <div class="layer-top">
      <div id="logo-1" class="logo-container">
        <img src="/mambo1.png" alt="Mambo">
      </div>
    </div>
  </div>

  <div id="root"></div>

  <script>
    const splash = document.getElementById('splash-screen');
    const logo1 = document.getElementById('logo-1');
    const logo2 = document.getElementById('mambo-moving-logo');

    const startAnimation = () => {
      setTimeout(() => {
        if(logo1) logo1.style.opacity = '1';
      }, 50);

      setTimeout(() => {
        if(splash) splash.classList.add('swipe-active');
        if(logo2) logo2.style.opacity = '1';
      }, 850);

      // Déclenchement de la translation fluide vers le coin
      setTimeout(() => {
        if(splash) splash.classList.add('shrink');
      }, 1700);

      // Sécurité de secours si React ne prend pas le relais à temps
      setTimeout(() => {
        if(splash && !splash.classList.contains('instantly-hidden')) {
          splash.classList.add('fade-out');
        }
      }, 2600);
    };

    startAnimation();
  </script>
</body>
</html>
